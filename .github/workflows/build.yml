name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate && ls -la

      - name: 编译
        run: |
          set -o pipefail
          xcodebuild \
            -project AIZhushou.xcodeproj \
            -scheme AIZhushou \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AIZhushou.app Payload/
          zip -qry AIZhushou.ipa Payload
          ls -lh AIZhushou.ipa
          rm -rf Payload

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: AIZhushou-ipa
          path: AIZhushou.ipa
          retention-days: 14
