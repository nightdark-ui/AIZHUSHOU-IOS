name: AIZhushou
options:
  bundleIdPrefix: com.nightdark
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  AIZhushou:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AI小助手
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: 需要麦克风来语音提问
        NSSpeechRecognitionUsageDescription: 需要语音识别把你说的话变成文字
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightdark.aizhushou
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
