name: AIZhushou
options:
  bundleIdPrefix: com.nightdark
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  AIZhushou:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AI小助手
        CFBundleShortVersionString: "1.9.0"
        CFBundleVersion: "204"
        BuildTime: "2026-11-26 18:33"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: 需要保存款式图片到相册
        NSMicrophoneUsageDescription: 需要麦克风来语音提问
        NSSpeechRecognitionUsageDescription: 需要语音识别把你说的话变成文字
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightdark.aizhushou
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
